    product: xworkmate
    editions: [selfhost, managed, paygo, saas]
    domains: [web-saas]
    surface: public
    routes: ["/products/*"]
    api_prefixes: []
    tables: []
    depends_on: []

  - id: portal.route.ai_workspace
    owner_repo: ai-workspace-services/portal
    title: AI Workspace application
    source: routeSurface
    product: ai-workspace
    editions: [managed, paygo, saas]
    domains: [ai-workspace]
    surface: app
    routes: [/ai-workspace, "/ai-workspace/*"]
    api_prefixes: [/api/ai-workspace]
    tables: []
    depends_on: [accounts.auth]

  - id: accounts.auth
    owner_repo: ai-workspace-services/accounts
    title: Accounts and authentication
    source: routeSurface
    product: xconnect
    editions: [selfhost, managed, paygo, saas]
    domains: [web-saas]
    surface: internal
    routes: []
    api_prefixes: [/api/auth]
    tables: [public.users, public.subscriptions, public.billing_plans]
    depends_on: []
