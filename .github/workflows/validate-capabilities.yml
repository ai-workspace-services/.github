name: Validate capability manifest

on:
  pull_request:
    paths:
      - "capabilities/**"
      - "scripts/validate-capabilities.py"
      - "scripts/requirements.txt"
      - "Makefile"
      - ".github/workflows/validate-capabilities.yml"
  push:
    branches: [main]
    paths:
      - "capabilities/**"
      - "scripts/validate-capabilities.py"
      - "scripts/requirements.txt"
      - "Makefile"
      - ".github/workflows/validate-capabilities.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make validate
